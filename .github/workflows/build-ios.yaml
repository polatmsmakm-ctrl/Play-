name: Build iOS

on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  build_ios:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
    - name: Set Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 16.4
    - name: Install dpkg
      run: |
        brew install dpkg
    - name: Install Vulkan SDK
      run: |
        cd $RUNNER_WORKSPACE
        curl -L --show-error --output vulkansdk.zip https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/mac/vulkansdk-macos-${VULKAN_SDK_VERSION}.zip?Human=true
        unzip vulkansdk.zip
        sudo ./InstallVulkan-${VULKAN_SDK_VERSION}.app/Contents/MacOS/InstallVulkan-${VULKAN_SDK_VERSION} in --al --c com.lunarg.vulkan.ios
        echo "VULKAN_SDK=${HOME}/VulkanSDK/${VULKAN_SDK_VERSION}/iOS" >> $GITHUB_ENV
      env:
        VULKAN_SDK_VERSION: '1.4.309.0'
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Force Fetch Git Tags
      run: git fetch --tags --force
    - name: Set SHORT_HASH
      run: echo "VALUE=${LONG_HASH:0:8}" >> $GITHUB_OUTPUT
      id: short_hash
      env:
        LONG_HASH: ${{ github.sha }}
    - name: Generate CMake Project
      run: |
        mkdir build
        cd build
        cmake .. -G"Xcode" -DCMAKE_TOOLCHAIN_FILE=../deps/Dependencies/cmake-ios/ios.cmake -DTARGET_IOS=ON -DCMAKE_PREFIX_PATH=$VULKAN_SDK
    - name: Build
      run: |
        cd build
        cmake --build . --config Release
        codesign -s "-" Source/ui_ios/Release-iphoneos/Play.app
    - name: Generate IPA
      run: |
        cd installer_ios
        ./build_ipa.sh
    - name: Upload a Build Artifact ipa/deb/bz2
      uses: actions/upload-artifact@v4
      with:
        name: Play_iOS
        path: installer_ios/Play.ipa
    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ios-latest
        name: Play! iOS (latest)
        files: installer_ios/Play.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
